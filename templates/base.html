<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}KT 정산 자동화{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="header">
    <div class="header-inner">
      <div class="logo">
        <span class="logo-kt">KT</span>
        <span class="logo-text">정산 자동화 포털</span>
      </div>
      <nav>
        <a href="{{ url_for('index') }}" class="nav-link">새 정산 실행</a>
      </nav>
    </div>
  </header>

  <main class="main">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="alert alert-{{ category }}">{{ message }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    {% block content %}{% endblock %}
  </main>

  <footer class="footer">
    <p>KT커머스 네트워크사업1팀 · 정산 자동화 시스템 v1.0</p>
  </footer>
</body>
</html>
